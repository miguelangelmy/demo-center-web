<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-gray-200 px-6 md:px-10 py-3 shadow-sm">
<!-- Logo Section (Left) -->
<div class="flex items-center flex-none">
  <a href="/home.html">
    <img src="/images/GlobalLogo_NTTDATA_FutureBlue_RGB.svg" alt="NTT DATA" class="w-40 md:w-48" />
  </a>
  <div class="text-slate-900 text-3xl @[480px]:text-4xl font-bold font-['Noto_Serif']">
    Supply Chain Demo Center
  </div>
</div>

<!-- Navigation Section (Center) -->
<nav class="hidden md:flex items-center justify-center flex-1 px-6">
  <div class="flex items-center gap-8">
    <a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/industries">Industries</a>
<a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/processes/">Processes</a>
    <a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/solutions">Solutions</a>
    <a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/events.html">Events</a>
<a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/livinglab.html">Living Lab</a>
    <a class="text-slate-700 hover:text-[#1672ce] text-sm font-medium leading-normal transition-colors" href="/contactus.html">Contact Us</a>
  </div>
</nav>

<!-- Actions Section (Right) -->
<div class="flex items-center gap-4">
  <div class="relative inline-block text-left" x-data="{ open: false, language: 'English' }">
  <button type="button" @click="open = !open" class="flex items-center gap-2 px-3 py-2 text-sm text-slate-700 hover:text-[#1672ce] transition-colors">
    <span class="material-symbols-outlined text-base">language</span>
    <span x-text="language"></span>
    <span class="material-symbols-outlined text-base" x-bind:class="{ 'rotate-180': open }">expand_more</span>
  </button>
  <div x-show="open"
       @click.away="open = false"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="transform opacity-0 scale-95"
       x-transition:enter-end="transform opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="transform opacity-100 scale-100"
       x-transition:leave-end="transform opacity-0 scale-95"
       class="absolute right-0 mt-2 w-36 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50">
    <div class="py-1" role="menu" aria-orientation="vertical">
      <a href="#" @click.prevent="language = 'English'; open = false"
         class="block px-4 py-2 text-sm text-slate-700 hover:bg-gray-100 hover:text-[#1672ce]" role="menuitem">English</a>
      <a href="#" @click.prevent="language = 'Español'; open = false"
         class="block px-4 py-2 text-sm text-slate-700 hover:bg-gray-100 hover:text-[#1672ce]" role="menuitem">Español</a>
      <a href="#" @click.prevent="language = '日本語'; open = false"
         class="block px-4 py-2 text-sm text-slate-700 hover:bg-gray-100 hover:text-[#1672ce]" role="menuitem">日本語</a>
    </div>
  </div>
</div>
<button class="md:hidden text-slate-700">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</header>

<!-- Dynamic Breadcrumb -->
<script>
  (function() {
    const BREADCRUMB_STORAGE_KEY = 'nttDataBreadcrumb';

    // Helper function to get page name from path
    function getPageName(path) {
      const pathToNameMap = {
        '/home.html': 'Home',
        '/industries': 'Industries',
        '/processes/': 'Processes',
        '/events.html': 'Events',
        '/livinglab.html': 'Living Lab',
        '/contactus.html': 'Contact Us'
      };

      // Check if path matches any known page
      for (const key in pathToNameMap) {
        if (path.startsWith(key)) {
          return pathToNameMap[key];
        }
      }

      // For sub-pages, extract the last directory name
      const parts = path.split('/').filter(part => part !== '');
      if (parts.length > 0) {
        return parts[parts.length - 1].replace('.html', '').replace('-', ' ');
      }

      return 'Unknown';
    }

    // Initialize breadcrumb from storage or with home page
    function initBreadcrumb() {
      let breadcrumb = JSON.parse(localStorage.getItem(BREADCRUMB_STORAGE_KEY));
      if (!breadcrumb || breadcrumb.length === 0) {
        breadcrumb = [{ name: 'Home', path: '/home.html' }];
      }

      updateBreadcrumbDisplay(breadcrumb);
    }

    // Update breadcrumb display
    function updateBreadcrumbDisplay(breadcrumb) {
      const breadcrumbContainer = document.createElement('div');
      breadcrumbContainer.className = 'bg-gradient-to-b from-slate-900 to-slate-800 text-white';
      breadcrumbContainer.innerHTML = `
        <div class="max-w-6xl mx-auto px-6 sm:px-10">
          <nav class="flex py-4" aria-label="Breadcrumb">
            <ol class="inline-flex items-center space-x-1 md:space-x-3">
              ${breadcrumb.map((item, index) => `
                <li class="${index === breadcrumb.length - 1 ? 'aria-current="page"' : ''}">
                  <div class="flex items-center">
                    ${index > 0 ? `<span class="material-symbols-outlined text-slate-400 mx-1" style="font-size: 1.25rem;">chevron_right</span>` : ''}
                    <a href="${item.path}" class="ml-1 text-sm font-medium text-slate-400 hover:text-white transition-colors">${item.name}</a>
                  </div>
                </li>
              `).join('')}
            </ol>
          </nav>
        </div>
      `;

      // Insert breadcrumb before the header
      const existingBreadcrumb = document.querySelector('.breadcrumb-container');
      if (existingBreadcrumb) {
        existingBreadcrumb.replaceWith(breadcrumbContainer);
      } else {
        document.querySelector('body').insertBefore(breadcrumbContainer, document.querySelector('header'));
      }

      // Add class for easy selection
      breadcrumbContainer.classList.add('breadcrumb-container');
    }

    // Update breadcrumb when navigation occurs
    function updateBreadcrumbOnNavigation() {
      // Get current path
      const currentPath = window.location.pathname;

      // Get current breadcrumb from storage
      let breadcrumb = JSON.parse(localStorage.getItem(BREADCRUMB_STORAGE_KEY)) || [];

      // Get current page name
      const currentPageName = getPageName(currentPath);

      // If current page is not already the last item in breadcrumb, add it
      if (breadcrumb.length === 0 || breadcrumb[breadcrumb.length - 1].name !== currentPageName) {
        breadcrumb.push({ name: currentPageName, path: currentPath });

        // Save updated breadcrumb to storage
        localStorage.setItem(BREADCRUMB_STORAGE_KEY, JSON.stringify(breadcrumb));

        // Update display
        updateBreadcrumbDisplay(breadcrumb);
      }
    }

    // Initialize breadcrumb on page load
    document.addEventListener('DOMContentLoaded', function() {
      initBreadcrumb();
      updateBreadcrumbOnNavigation();
    });

    // Update breadcrumb when links are clicked
    document.addEventListener('click', function(e) {
      if (e.target.closest('a')) {
        const target = e.target.closest('a');
        if (target.href.includes(document.location.origin)) {
          // Only handle internal links
          setTimeout(updateBreadcrumbOnNavigation, 100); // Wait for navigation to complete
        }
      }
    });
  })();
</script>
